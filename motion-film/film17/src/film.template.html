<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoachCards Motion Film</title>
<style>
@font-face{font-family:'Disp';font-weight:800;src:url({{FONT:Manrope-800.ttf}}) format('truetype')}
@font-face{font-family:'Disp';font-weight:500;src:url({{FONT:Manrope-500.ttf}}) format('truetype')}
@font-face{font-family:'Inter';font-weight:400;src:url({{FONT:Inter-400.ttf}}) format('truetype')}
@font-face{font-family:'Inter';font-weight:500;src:url({{FONT:Inter-500.ttf}}) format('truetype')}
@font-face{font-family:'Inter';font-weight:600;src:url({{FONT:Inter-600.ttf}}) format('truetype')}
@font-face{font-family:'Inter';font-weight:700;src:url({{FONT:Inter-700.ttf}}) format('truetype')}
@font-face{font-family:'Mono';font-weight:500;src:url({{FONT:IBMPlexMono-500.ttf}}) format('truetype')}
@font-face{font-family:'Serif';font-weight:400;src:url({{FONT:PlayfairDisplay-400.ttf}}) format('truetype')}
:root{--green:#3AB54A;--text:#121212;--grey:#83858D;--bg2:#F2F2F2;--ui-bg:#0b0d0c;--ctl:#1b1d1c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d0c;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
#wrap{position:absolute;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#fff;transform-origin:0 0;color:var(--text)}
.abs{position:absolute;left:0;top:0}
.disp{font-family:Disp,sans-serif;font-weight:800;letter-spacing:-0.03em;line-height:1}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0.06em 0.02em 0.12em}
.wi{display:inline-block;will-change:transform}
.line{white-space:nowrap}
#controls{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--ctl);border-top:1px solid #2a2d2b}
#controls button{background:#2a2d2b;color:#fff;border:0;border-radius:10px;height:40px;min-width:44px;padding:0 14px;font:600 14px Inter,sans-serif;cursor:pointer}
#controls button:hover{background:#353936}
#controls button:focus-visible,#scrub:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#scrub{flex:1;accent-color:var(--green);height:40px}
#time{font:500 13px Mono,monospace;color:#c9ccca;min-width:96px;text-align:right}
body.capture #controls{display:none}
body.capture #wrap{inset:0}
@media (max-width:600px){#controls{gap:6px;padding:0 8px}#controls button{padding:0 10px;min-width:40px}#time{min-width:0;font-size:11px}}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="controls">
  <button id="play" aria-label="Play">Play</button>
  <button id="restart" aria-label="Restart">Restart</button>
  <input id="scrub" type="range" min="0" max="17.2" step="0.001" value="0" aria-label="Scrub timeline">
  <span id="time">0.00 / 17.20</span>
  <button id="sound" aria-label="Turn sound on" aria-pressed="false">Sound off</button>
</div>
<audio id="aud" preload="auto" src="{{AUDIO}}"></audio>
<script>
const DUR = 17.2, FPS = 30;
const IMG = {{IMAGES}};
const GREEN = '#3AB54A', TEXT = '#121212', GREY = '#83858D', LIGHT = '#D9DADD';
const stage = document.getElementById('stage');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const expo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(x));
const inOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outCubic = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function el(tag, css = {}, parent = stage, html) { const e = document.createElement(tag); e.className = 'abs'; Object.assign(e.style, css); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }
function S(e, o) { for (const k in o) e.style[k] = o[k]; }
function img(src, css, parent) { const i = el('img', css, parent); i.src = src; i.alt = ''; i.draggable = false; return i; }
// headline builder: returns {node, words:[inner spans]}
function headline(lines, css, parent = stage) {
  const node = el('div', css, parent); const words = [];
  lines.forEach((ln, li) => {
    const row = document.createElement('div'); row.className = 'line'; node.appendChild(row);
    ln.text.split(' ').forEach((w, wi) => {
      const m = document.createElement('span'); m.className = 'mask';
      const s = document.createElement('span'); s.className = 'wi'; s.textContent = w; if (ln.color) s.style.color = ln.color;
      m.appendChild(s); row.appendChild(m); words.push(s);
      if (wi < ln.text.split(' ').length - 1) row.appendChild(document.createTextNode(' '));
    });
  });
  return { node, words };
}
// word-by-word masked reveal (exponential ease-out, 0.55 s, 0.08 s stagger) and optional upward exit
function reveal(h, t, t0, exitA = null, exitB = null, stagger = 0.08, dur = 0.55) {
  h.words.forEach((w, i) => {
    const p = expo(seg(t, t0 + i * stagger, t0 + i * stagger + dur));
    let y = (1 - p) * 115;
    if (exitA !== null) { const q = inOut(seg(t, exitA + i * 0.02, exitB + i * 0.02)); y -= q * 115; }
    w.style.transform = `translateY(${y}%)`;
  });
}

// ---------- background ----------
const bg = el('div', { width: '1920px', height: '1080px', background: '#fff' });

// ---------- HOOK 0.00-2.40 ----------
const hook = headline([{ text: 'Finding a good PT' }, { text: 'is pure guesswork.' }],
  { width: '1920px', top: '250px', textAlign: 'center', fontSize: '150px', lineHeight: '1.02' });
hook.node.classList.add('disp'); hook.node.style.letterSpacing = '-0.035em';
const SQ = 21, SQS = 30, SQG = 14, SQX0 = (1920 - (SQ * SQS + (SQ - 1) * SQG)) / 2, SQY = 690;
const squares = [];
for (let i = 0; i < SQ; i++) squares.push(el('div', { width: SQS + 'px', height: SQS + 'px', borderRadius: '8px', background: '#E7E8EA', left: (SQX0 + i * (SQS + SQG)) + 'px', top: SQY + 'px' }));
const counter = el('div', { width: '1920px', top: (SQY + 58) + 'px', textAlign: 'center', font: '500 26px Mono,monospace', color: GREY, letterSpacing: '0.04em' });
const fillT = i => 0.95 + Math.sqrt(i / (SQ - 1)) * 1.0; // accelerating left-to-right fill

// ---------- INTRO 2.40-4.68 ----------
const tile = el('div', { borderRadius: '22px', overflow: 'hidden', background: GREEN });
const tileImg = img(IMG.trainer, { width: '100%', height: '100%', objectFit: 'cover', objectPosition: '50% 18%' }, tile);
const introKick = el('div', { width: '1920px', top: '452px', textAlign: 'center', font: '500 36px Inter,sans-serif', color: GREY }, stage, 'Meet CoachCards');
const intro = headline([{ text: 'Every PT, ranked' }, { text: 'and reviewed.', color: GREEN }],
  { width: '1920px', top: '512px', textAlign: 'center', fontSize: '124px', lineHeight: '1.04' });
intro.node.classList.add('disp');

// ---------- DEMO 4.64-10.25 ----------
const colWords = ['Find,', 'Compare,', 'Trust.'].map((w, i) => {
  const h = headline([{ text: w }], { left: '96px', top: (300 + i * 124) + 'px', fontSize: '112px' }); h.node.classList.add('disp'); return h; });
const capTexts = ['Search UK trainers', 'Compare coach cards', 'Read verified reviews'];
const caps = capTexts.map(c => el('div', { left: '100px', top: '700px', font: '500 32px Inter,sans-serif', color: GREY, whiteSpace: 'nowrap' }, stage, c));
const WX = 760, WY = 96, WW = 1104, WH = 888, CH = 52, CS = 1104 / 1440; // window + chrome, css->display scale
const win = el('div', { left: WX + 'px', top: WY + 'px', width: WW + 'px', height: WH + 'px', borderRadius: '18px', overflow: 'hidden', background: '#0a130b', boxShadow: '0 30px 80px rgba(18,18,18,.18), 0 6px 18px rgba(18,18,18,.10)', transformOrigin: '50% 50%' });
const chrome = el('div', { width: WW + 'px', height: CH + 'px', background: '#F2F2F2', borderBottom: '1px solid #E2E3E5' }, win);
['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => el('div', { left: (20 + i * 22) + 'px', top: '19px', width: '13px', height: '13px', borderRadius: '50%', background: c }, chrome));
const url = el('div', { left: '312px', top: '11px', width: '480px', height: '30px', borderRadius: '9px', background: '#fff', border: '1px solid #E2E3E5', font: '500 15px Inter,sans-serif', color: '#5d6066', textAlign: 'center', lineHeight: '28px' }, chrome, 'coachcards.co.uk/find-a-trainer');
const content = el('div', { top: CH + 'px', width: WW + 'px', height: (WH - CH) + 'px', overflow: 'hidden' }, win);
// scene A: live Find a Trainer (css y from 520)
const sceneA = el('div', { width: WW + 'px', height: (WH - CH) + 'px' }, content);
const aAny = img(IMG.fatA_any, { width: WW + 'px' }, sceneA);
const aWL = img(IMG.fatA_wl, { width: WW + 'px', opacity: 0 }, sceneA);
// scene B: two real coach cards on the site's dark list background
const sceneB = el('div', { width: WW + 'px', height: (WH - CH) + 'px', background: '#0a130b' }, content);
const bHead = el('div', { left: '52px', top: '64px', font: '600 18px Inter,sans-serif', color: '#9aa39b', letterSpacing: '.08em' }, sceneB, 'WEIGHT LOSS · 3 TRAINERS');
const CB = { x: 52, w: 1000 }; const CK = 1000 / 1036;
const cTracy = img(IMG.card_tracy, { left: CB.x + 'px', top: '170px', width: CB.w + 'px' }, sceneB);
const cPaul = img(IMG.card_paul, { left: CB.x + 'px', top: (170 + 148 + 44) + 'px', width: CB.w + 'px' }, sceneB);
const hlA = el('div', { borderRadius: '14px', border: '3px solid ' + GREEN, boxShadow: '0 0 0 6px rgba(58,181,74,.18)' }, sceneB);
// scene C: Tracy Gibson profile header + verified review card
const sceneC = el('div', { width: WW + 'px', height: (WH - CH) + 'px', background: '#F4F6F4' }, content);
const cHero = img(IMG.profile_hero, { width: WW + 'px' }, sceneC);
const cRevWrap = el('div', { left: ((WW - 470) / 2) + 'px', top: '532px', width: '470px', height: '290px', borderRadius: '20px', overflow: 'hidden', boxShadow: '0 18px 40px rgba(18,18,18,.14)', background: '#fff' }, sceneC);
img(IMG.review_card, { width: '470px' }, cRevWrap);
const hlC = el('div', { left: ((WW - 470) / 2 - 6) + 'px', top: '526px', width: '482px', height: '302px', borderRadius: '24px', border: '3px solid ' + GREEN }, sceneC);
// flying card for match cuts (A->B morph, B->C grab)
const fly = img(IMG.card_tracy, { borderRadius: '10px', opacity: 0 });

// ---------- WALL 10.20-12.05 ----------
const wall = el('div', { width: '1920px', height: '1080px', background: GREEN, overflow: 'hidden' });
const wallHead = el('div', { width: '1920px', top: '118px', textAlign: 'center', fontSize: '72px', color: '#fff' }, wall, 'Trainers for every goal'); wallHead.classList.add('disp');
const SPEC = ['Weight Loss', 'Muscle Building', 'Strength & Conditioning', 'HIIT', 'Rehabilitation', 'Nutrition', 'Sports Performance', 'Hyrox', 'Yoga & Pilates', 'Boxing', 'Running', 'Functional Fitness'];
const ICON = '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3AB54A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>';
const rows = [0, 1, 2].map(r => {
  const row = el('div', { top: (300 + r * 214) + 'px', left: '0px', width: '1920px', height: '176px' }, wall);
  const tiles = [];
  for (let i = 0; i < 12; i++) {
    const label = SPEC[(i + r * 4) % SPEC.length];
    const x = -150 + i * 204 + r * 68;
    const tl = el('div', { left: x + 'px', top: '0px', width: '176px', height: '176px', borderRadius: '28px', background: '#fff', boxShadow: '0 14px 34px rgba(0,0,0,.18)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '10px', textAlign: 'center', padding: '0 14px' }, row,
      ICON + `<div style="font:700 19px/1.15 Inter,sans-serif;color:${TEXT}">${label.replace('&', '&amp;')}</div>`);
    tl.style.position = 'absolute'; tiles.push({ e: tl, x });
  }
  return { row, tiles };
});

// ---------- OUTPUTS 12.05-15.50 ----------
const outKick = el('div', { left: '96px', top: '330px', font: '500 48px Inter,sans-serif', color: GREY, whiteSpace: 'nowrap' }, stage, 'CoachCards lets you');
const PHR = [['find', 'trainers,'], ['compare', 'coaches,'], ['read real', 'reviews,'], ['prove your', 'credibility.']];
const PT = [12.15, 13.0, 13.85, 14.7, 15.48];
const phrases = PHR.map(p => { const h = headline([{ text: p[0] }, { text: p[1], color: GREEN }], { left: '96px', top: '410px', fontSize: '120px', lineHeight: '1.02' }); h.node.classList.add('disp'); return h; });
const G = []; // graphics, one per phrase
// g1: tilted 9:16 story card stepping through live mobile screens
G[0] = el('div', { left: '1290px', top: '170px', width: '360px', height: '740px' });
const g1card = el('div', { width: '360px', height: '740px', borderRadius: '44px', background: '#111', padding: '12px', boxShadow: '0 30px 70px rgba(18,18,18,.22)', transform: 'rotate(-6deg)' }, G[0]);
const g1scr = el('div', { left: '12px', top: '12px', width: '336px', height: '716px', borderRadius: '34px', overflow: 'hidden', background: '#000' }, g1card);
const g1imgs = [IMG.mob_fat, IMG.mob_cards, IMG.mob_reviews].map((s, i) => img(s, { width: '336px', opacity: i ? 0 : 1 }, g1scr));
// g2: three workflow nodes joined by connectors that draw on
G[1] = el('div', { left: '1180px', top: '230px', width: '620px', height: '620px' });
G[1].innerHTML = `<svg class="abs" width="620" height="620" viewBox="0 0 620 620" fill="none"><path id="cn1" d="M310 152 V 258" stroke="${GREEN}" stroke-width="6" stroke-linecap="round"/><path id="cn2" d="M310 362 V 468" stroke="${GREEN}" stroke-width="6" stroke-linecap="round"/></svg>`;
const NODES = ['Search', 'Compare', 'Speak to a trainer'];
const g2nodes = NODES.map((n, i) => el('div', { left: '110px', top: (48 + i * 210) + 'px', width: '400px', height: '104px', borderRadius: '26px', background: '#fff', boxShadow: '0 16px 36px rgba(18,18,18,.10)', display: 'flex', alignItems: 'center', gap: '20px', padding: '0 30px', font: '600 32px Inter,sans-serif', color: TEXT },
  G[1], `<span style="font:500 20px Mono,monospace;color:${GREEN}">0${i + 1}</span>${n}`));
const cn = [G[1].querySelector('#cn1'), G[1].querySelector('#cn2')];
cn.forEach(p => { p.style.strokeDasharray = '106'; });
// g3: verbatim review, set in serif, with a filling progress bar
G[2] = el('div', { left: '1130px', top: '330px', width: '680px', height: '383px', borderRadius: '26px', background: '#fff', boxShadow: '0 24px 60px rgba(18,18,18,.14)', padding: '48px 52px' });
G[2].innerHTML = `<div style="font:400 38px/1.32 Serif,serif;color:${TEXT}">“Been really enjoying my sessions, makes me feel welcome as a newcomer to the gym!”</div>
<div style="margin-top:28px;font:600 20px Inter,sans-serif;color:${TEXT}">Carole Taylor <span style="font-weight:500;color:${GREY}">· October 2026</span></div>
<div style="margin-top:6px;font:600 18px Inter,sans-serif;color:${GREEN}">✓ Verified Client</div>`;
const g3barBg = el('div', { left: '52px', top: '351px', width: '576px', height: '6px', borderRadius: '3px', background: '#E7E8EA' }, G[2]);
const g3bar = el('div', { left: '0px', top: '0px', height: '6px', borderRadius: '3px', background: GREEN }, g3barBg);
// g4: three credibility cards whose icons fill green
G[3] = el('div', { left: '1170px', top: '268px', width: '640px', height: '560px' });
const CRED = [['Verified client reviews', 'M5 12.5l4.2 4.2L19 7'], ['Qualifications on show', 'M12 3l7 3v5c0 5-3.4 8.6-7 10-3.6-1.4-7-5-7-10V6z'], ['Ranked UK, country & local', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z']];
const g4 = CRED.map((c, i) => {
  const card = el('div', { left: '0px', top: (i * 186) + 'px', width: '640px', height: '150px', borderRadius: '26px', background: '#fff', boxShadow: '0 16px 36px rgba(18,18,18,.10)', display: 'flex', alignItems: 'center', gap: '28px', padding: '0 34px' }, G[3],
    `<div class="ic" style="width:78px;height:78px;border-radius:22px;border:3px solid ${GREEN};display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${GREEN}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${c[1]}"/></svg></div><div style="font:600 30px Inter,sans-serif;color:${TEXT}">${c[0].replace('&', '&amp;')}</div>`);
  return card.querySelector('.ic');
});

// ---------- END CARD + BRAND MARK ----------
const mark = el('div', { background: '#0d1a0e', overflow: 'hidden' });
img(IMG['cc-logo'], { left: '6%', top: '6%', width: '88%', height: '88%' }, mark);
const endName = headline([{ text: 'CoachCards' }], { width: '1920px', top: '492px', textAlign: 'center', fontSize: '196px' });
endName.node.classList.add('disp'); endName.node.style.fontWeight = '500'; endName.node.style.letterSpacing = '-0.04em';
const endTag = headline([{ text: 'Find your trainer · coachcards.co.uk' }], { width: '1920px', top: '740px', textAlign: 'center', font: '500 54px Inter,sans-serif', color: GREY });

// ---------- CURSOR (visible 3.55-10.4) ----------
const ring = el('div', { width: '60px', height: '60px', marginLeft: '-30px', marginTop: '-30px', borderRadius: '50%', border: '3px solid ' + GREEN, opacity: 0 });
const cur = el('div', { width: '260px', height: '80px', transformOrigin: '0 0' });
cur.innerHTML = `<svg class="abs" width="34" height="44" viewBox="0 0 34 44" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))"><path d="M3 2 L3 36 L11.5 28 L17.5 41.5 L23.5 39 L17.6 25.8 L29 25.8 Z" fill="${GREEN}" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
<div class="abs" style="left:30px;top:40px;background:${GREEN};color:#fff;font:600 16px Inter,sans-serif;padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.18)">coachcards.co.uk</div>`;
// keyframes [t, x, y] for the arrow tip; presses [t]
const CK_ = [[3.55, 1560, 1140], [4.0, 960, 268], [4.05, 960, 268], [4.68, 1300, 560], [5.25, 1023, 226], [5.32, 1023, 226], [6.05, 1312, 442], [6.25, 1312, 442],
  [6.95, 1110, 396], [7.45, 1110, 396], [7.85, 1092, 574], [8.1, 1092, 574], [8.3, 1240, 402], [8.33, 1240, 402], [8.62, 1270, 340], [9.3, 1312, 790], [9.55, 1312, 790], [10.4, 1780, 1120]];
const PRESS = [4.05, 5.32, 6.22, 8.33, 9.48];
function cursorXY(t) {
  if (t <= CK_[0][0]) return [CK_[0][1], CK_[0][2]];
  for (let i = 0; i < CK_.length - 1; i++) { const a = CK_[i], b = CK_[i + 1]; if (t <= b[0]) { const p = inOut(seg(t, a[0], b[0])); return [lerp(a[1], b[1], p), lerp(a[2], b[2], p)]; } }
  const l = CK_[CK_.length - 1]; return [l[1], l[2]];
}

// ---------- render(t): sets every element from t ----------
function render(t) {
  t = clamp(t, 0, DUR);
  // background colour per section
  bg.style.background = (t >= 12.05 && t < 15.48) ? '#F2F2F2' : '#fff';

  // HOOK
  const hookOn = t < 2.45;
  hook.node.style.display = hookOn ? '' : 'none';
  reveal(hook, t, 0.08, 1.98, 2.30, 0.08, 0.55);
  squares.forEach((s, i) => {
    const d = Math.abs(i - 10);
    const tin = i === 10 ? 0.28 : 0.42 + d * 0.022;
    let sc = back(seg(t, tin, tin + 0.3));
    const ft = fillT(i);
    const filled = t >= ft || (i === 10 && t >= 0.28);
    const pop = Math.max(0, 1 - Math.abs(t - ft - 0.06) / 0.12);
    sc *= 1 + 0.32 * (t >= ft - 0.06 ? pop : 0);
    // merge into centre 2.02-2.40
    const m = inOut(seg(t, 2.02, 2.40));
    const x0 = SQX0 + i * (SQS + SQG), xc = SQX0 + 10 * (SQS + SQG);
    S(s, { display: t < 2.42 ? '' : 'none', left: lerp(x0, xc, m) + 'px', transform: `scale(${sc})`, background: filled ? GREEN : '#E7E8EA',
      boxShadow: (t >= ft && t < ft + 0.35) ? `0 0 0 ${4 + 10 * seg(t, ft, ft + 0.35)}px rgba(58,181,74,${0.35 * (1 - seg(t, ft, ft + 0.35))})` : 'none',
      opacity: i === 10 ? 1 : 1 - seg(t, 2.25, 2.40) });
  });
  const nFilled = squares.filter((_, i) => t >= fillT(i)).length;
  counter.textContent = 'Trainer ' + String(Math.max(1, nFilled)).padStart(2, '0');
  S(counter, { opacity: Math.min(seg(t, 0.5, 0.8), 1 - seg(t, 1.98, 2.2)), display: hookOn ? '' : 'none' });

  // INTRO: square -> portrait tile
  const g = inOut(seg(t, 2.40, 2.82));
  const sqx = SQX0 + 10 * (SQS + SQG), sqy = SQY;
  let tx = lerp(sqx, 850, g), ty = lerp(sqy, 120, g), tw = lerp(30, 220, g), th = lerp(30, 286, g);
  // drag into the window 4.05-4.68 (follows the cursor)

// ---------- player ----------
